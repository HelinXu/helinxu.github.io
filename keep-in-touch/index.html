<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Let's keep in touch | Helin Xu</title>
  <meta name="description" content="Helin Xu · 徐赫临 — let's keep in touch! WeChat, email, LinkedIn and more.">
  <meta name="author" content="Helin Xu">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://helinxu.com/keep-in-touch/">
  <meta property="og:title" content="Let's keep in touch | Helin Xu">
  <meta property="og:description" content="WeChat, email, LinkedIn and more.">
  <meta property="og:image" content="https://helinxu.com/images/helin.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
  <link rel="apple-touch-icon" href="../images/icon.jpg">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main class="page">
    <header class="hero">
      <img class="avatar" src="../images/helin.jpg" alt="Helin Xu" width="88" height="88">
      <h1 class="title">Let's keep in touch!</h1>
      <p class="name">Helin Xu · <span lang="zh-CN">徐赫临</span></p>
    </header>

    <ul class="contacts" id="contacts" aria-label="Contacts"></ul>
    <noscript><p class="noscript">Email me at <a href="mailto:xuhelin1911@gmail.com">xuhelin1911@gmail.com</a>.</p></noscript>

    <footer class="footer">
      <a href="../">helinxu.com</a>
    </footer>
  </main>

  <dialog class="qr" id="qr-dialog" aria-labelledby="qr-title">
    <h3 id="qr-title">Add me on WeChat</h3>
    <img id="qr-img" alt="WeChat QR code">
    <p class="qr-hint">In WeChat, long-press the code to add me</p>
    <p class="qr-id" id="qr-id-row" hidden>WeChat ID: <strong id="qr-id"></strong></p>
    <div class="qr-actions">
      <button type="button" class="btn btn-primary" id="qr-copy" hidden>Copy ID</button>
      <a class="btn" id="qr-save" download>Save image</a>
      <button type="button" class="btn" id="qr-close">Close</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=3"></script>
  <script src="icons.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
